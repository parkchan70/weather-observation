<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기후 해결사: 날씨 관찰 기록부</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 커스텀 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-blue-50 p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-700 flex items-center gap-2">
                    <i data-lucide="thermometer" class="w-8 h-8"></i>
                    기후 해결사: 날씨 관찰 기록부
                </h1>
                <p class="text-gray-500 mt-1">우리 동네 기온 변화를 직접 기록하고 분석해봐요.</p>
            </div>
            <button 
                id="btn-analyze"
                class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full transition-all shadow-lg active:scale-95 disabled:opacity-50"
            >
                <i data-lucide="brain-circuit" class="w-5 h-5"></i> 
                <span id="analyze-text">AI 과학자 분석</span>
            </button>
        </header>

        <!-- AI Analysis Banner -->
        <div id="ai-analysis-box" class="hidden bg-indigo-100 border-l-4 border-indigo-500 p-4 rounded-r-lg mb-8 fade-in">
            <p class="font-semibold text-indigo-900">💡 AI 과학자의 코멘트:</p>
            <p id="ai-analysis-text" class="text-indigo-800 mt-1"></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Input Section -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100 h-fit">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-blue-600">
                    <i data-lucide="save" class="w-5 h-5"></i> 오늘 관찰 기록하기
                </h2>
                <form id="record-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">관찰 날짜</label>
                        <input 
                            type="date" 
                            id="input-date"
                            required
                            class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none"
                        >
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1 text-center">기온 (℃)</label>
                            <input 
                                type="number" 
                                id="input-temp"
                                step="0.1"
                                placeholder="25.5"
                                required
                                class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none text-center text-lg font-bold"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1 text-center">습도 (%)</label>
                            <input 
                                type="number" 
                                id="input-humidity"
                                placeholder="40"
                                required
                                class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none text-center text-lg font-bold"
                            >
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">오늘의 날씨</label>
                        <div class="grid grid-cols-4 gap-2" id="weather-buttons">
                            <!-- Weather buttons generated by JS -->
                        </div>
                    </div>
                    <button 
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-colors shadow-md active:scale-95"
                    >
                        관찰 기록 저장
                    </button>
                </form>
            </div>

            <!-- Visualization & History -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Chart Area -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-blue-600">
                        기온 변화 트렌드
                    </h2>
                    <div class="h-64 w-full relative">
                        <canvas id="weatherChart"></canvas>
                        <div id="chart-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-white">
                            <p>기록된 데이터가 없습니다.</p>
                            <p class="text-sm">왼쪽에서 오늘의 날씨를 기록해보세요!</p>
                        </div>
                    </div>
                </div>

                <!-- List Area -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
                    <h2 class="text-xl font-bold mb-4 text-blue-600">관찰 역사</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b border-gray-100 text-gray-500 text-sm">
                                    <th class="pb-3 font-medium">날짜</th>
                                    <th class="pb-3 font-medium">날씨</th>
                                    <th class="pb-3 font-medium">기온</th>
                                    <th class="pb-3 font-medium">습도</th>
                                    <th class="pb-3 font-medium text-right">삭제</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body" class="divide-y divide-gray-50">
                                <!-- History rows generated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 날씨 타입 정의
        const weatherTypes = [
            { id: 'Sunny', label: '맑음', icon: 'sun', color: 'text-yellow-500' },
            { id: 'Cloudy', label: '흐림', icon: 'cloud', color: 'text-gray-400' },
            { id: 'Rainy', label: '비', icon: 'cloud-rain', color: 'text-blue-500' },
            { id: 'Snowy', label: '눈', icon: 'snowflake', color: 'text-blue-200' }
        ];

        // 상태 관리
        let records = [];
        let selectedWeather = 'Sunny';
        let chartInstance = null;
        let isAnalyzing = false;

        // DOM 요소
        const inputDate = document.getElementById('input-date');
        const inputTemp = document.getElementById('input-temp');
        const inputHumidity = document.getElementById('input-humidity');
        const form = document.getElementById('record-form');
        const weatherButtonsContainer = document.getElementById('weather-buttons');
        const historyTableBody = document.getElementById('history-table-body');
        const chartEmptyState = document.getElementById('chart-empty-state');
        const btnAnalyze = document.getElementById('btn-analyze');
        const analyzeText = document.getElementById('analyze-text');
        const aiAnalysisBox = document.getElementById('ai-analysis-box');
        const aiAnalysisText = document.getElementById('ai-analysis-text');

        // 초기화
        function init() {
            // 오늘 날짜 기본 세팅
            inputDate.value = new Date().toISOString().split('T')[0];
            
            // 로컬 스토리지 데이터 불러오기
            const savedData = localStorage.getItem('weather_logs');
            if (savedData) {
                records = JSON.parse(savedData);
            }

            renderWeatherButtons();
            updateUI();
            
            // Lucide 아이콘 초기 렌더링
            lucide.createIcons();
        }

        // 날씨 버튼 렌더링
        function renderWeatherButtons() {
            weatherButtonsContainer.innerHTML = weatherTypes.map(type => `
                <button
                    type="button"
                    onclick="setWeather('${type.id}')"
                    class="p-3 rounded-xl border flex flex-col items-center gap-1 transition-all ${
                        selectedWeather === type.id 
                        ? 'bg-blue-100 border-blue-500 shadow-inner' 
                        : 'bg-white border-gray-200 hover:bg-gray-50'
                    }"
                >
                    <i data-lucide="${type.icon}" class="${type.color}"></i>
                    <span class="text-xs mt-1 font-medium">${type.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        // 날씨 선택 변경
        function setWeather(weatherId) {
            selectedWeather = weatherId;
            renderWeatherButtons();
        }

        // 데이터 저장
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const temp = parseFloat(inputTemp.value);
            const humidity = parseInt(inputHumidity.value);
            
            if (isNaN(temp) || isNaN(humidity)) return;

            const newRecord = {
                id: Date.now(),
                date: inputDate.value,
                temp: temp,
                humidity: humidity,
                weather: selectedWeather
            };

            records.push(newRecord);
            // 날짜순 정렬
            records.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            saveToStorage();
            
            // 입력창 초기화
            inputTemp.value = '';
            inputHumidity.value = '';
            
            updateUI();
        });

        // 데이터 삭제
        window.deleteRecord = (id) => {
            records = records.filter(r => r.id !== id);
            saveToStorage();
            updateUI();
        };

        // 로컬 스토리지 저장
        function saveToStorage() {
            localStorage.setItem('weather_logs', JSON.stringify(records));
        }

        // UI 전체 업데이트 (표, 그래프)
        function updateUI() {
            renderTable();
            renderChart();
            
            if (records.length === 0) {
                chartEmptyState.style.display = 'flex';
            } else {
                chartEmptyState.style.display = 'none';
            }
        }

        // 관찰 역사 표 렌더링
        function renderTable() {
            if (records.length === 0) {
                historyTableBody.innerHTML = `
                    <tr>
                        <td colSpan="5" class="py-8 text-center text-gray-400">데이터가 없습니다.</td>
                    </tr>
                `;
                return;
            }

            historyTableBody.innerHTML = records.map(record => {
                const weatherInfo = weatherTypes.find(w => w.id === record.weather);
                return `
                    <tr class="group hover:bg-gray-50 transition-colors">
                        <td class="py-4 text-sm">${record.date}</td>
                        <td class="py-4"><i data-lucide="${weatherInfo.icon}" class="${weatherInfo.color} w-5 h-5"></i></td>
                        <td class="py-4 font-semibold">${record.temp}℃</td>
                        <td class="py-4 text-gray-500">${record.humidity}%</td>
                        <td class="py-4 text-right">
                            <button 
                                onclick="deleteRecord(${record.id})"
                                class="p-2 text-gray-300 hover:text-red-500 transition-colors"
                            >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        // Chart.js 그래프 렌더링
        function renderChart() {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            
            // 기존 차트가 있다면 파괴
            if (chartInstance) {
                chartInstance.destroy();
            }

            if (records.length === 0) return;

            const labels = records.map(r => r.date);
            const tempData = records.map(r => r.temp);
            const humidityData = records.map(r => r.humidity);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '기온 (℃)',
                            data: tempData,
                            borderColor: '#3b82f6',
                            backgroundColor: '#3b82f6',
                            borderWidth: 3,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            tension: 0.3
                        },
                        {
                            label: '습도 (%)',
                            data: humidityData,
                            borderColor: '#94a3b8',
                            backgroundColor: '#94a3b8',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.9)',
                            titleColor: '#1e293b',
                            bodyColor: '#1e293b',
                            borderColor: '#e2e8f0',
                            borderWidth: 1,
                            padding: 10,
                            boxPadding: 4,
                            usePointStyle: true,
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false }
                        },
                        y: {
                            grid: {
                                color: '#f1f5f9',
                                drawBorder: false,
                            }
                        }
                    }
                }
            });
        }

        // AI 분석 기능
        btnAnalyze.addEventListener('click', () => {
            if (records.length < 2) {
                aiAnalysisText.textContent = "데이터가 최소 2개 이상 있어야 분석이 가능합니다.";
                aiAnalysisBox.classList.remove('hidden');
                return;
            }
            
            if (isAnalyzing) return;

            isAnalyzing = true;
            btnAnalyze.disabled = true;
            btnAnalyze.classList.add('opacity-75');
            analyzeText.textContent = "분석 중...";
            
            // 시뮬레이션 지연
            setTimeout(() => {
                const totalTemp = records.reduce((acc, cur) => acc + cur.temp, 0);
                const avgTemp = (totalTemp / records.length).toFixed(1);
                
                const firstRecord = records[0];
                const lastRecord = records[records.length - 1];
                const trend = lastRecord.temp > firstRecord.temp ? "상승" : "하강";
                
                aiAnalysisText.innerHTML = `관찰 기록 분석 결과, 해당 기간의 평균 기온은 약 <strong>${avgTemp}도</strong>입니다. 초기 기록 대비 기온이 <strong>${trend}</strong>하는 경향을 보이고 있어 기후 변화 모니터링이 필요합니다.`;
                
                aiAnalysisBox.classList.remove('hidden');
                
                isAnalyzing = false;
                btnAnalyze.disabled = false;
                btnAnalyze.classList.remove('opacity-75');
                analyzeText.textContent = "AI 과학자 분석";
            }, 1500);
        });

        // 앱 시작
        init();
    </script>
</body>
</html>
